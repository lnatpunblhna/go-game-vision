name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Cross-platform compile & format guard. Does NOT need OpenCV because it only
  # touches the non-gocv packages. This is exactly the guard that catches "one
  # platform stops compiling" regressions, e.g. an interface method missing from a
  # *_darwin.go / *_windows.go file.
  #
  # Scope note 1 (cgo): capture/mouse/keyboard are cgo-backed on darwin
  # (Objective-C), and cross compiling from Linux runs with CGO_ENABLED=0, which
  # drops every `import "C"` file from the build -- newPlatformCapture /
  # newPlatformMouseClicker / newPlatformKeyboard would then look undefined. Those
  # packages are therefore vetted for darwin in the macOS job (`go vet ./...`),
  # not here.
  #
  # Scope note 2 (gocv): pkg/image and pkg/automation depend on gocv, which needs
  # cgo plus a platform-native OpenCV. They cannot be cross-compiled at all and are
  # covered only by the macOS job. Do not add them to the steps below.
  lint:
    name: Lint & cross-compile (non-cgo pkgs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      - name: Vet for windows (all non-gocv packages)
        run: >
          GOOS=windows go vet
          ./pkg/process/ ./pkg/capture/ ./pkg/mouse/ ./pkg/utils/
          ./pkg/platform/ ./pkg/keyboard/ ./pkg/safety/

      - name: Vet for darwin (pure-Go packages only)
        run: GOOS=darwin go vet ./pkg/process/ ./pkg/utils/ ./pkg/platform/

  # macOS: full build + tests (OpenCV available via Homebrew, so the gocv-backed
  # image package and the offline unit tests run for real).
  test-macos:
    name: Build & test (macOS, OpenCV)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Must be opencv@4, NOT the `opencv` formula: Homebrew's main formula moved
      # to OpenCV 5.0.0, which no longer ships opencv4.pc, while gocv only wraps
      # the OpenCV 4 C++ API ("requires OpenCV 4.12.0" upstream). Building against
      # the 5.x bottle fails with `Package 'opencv4' not found`.
      # opencv@4 is keg-only, so its pkgconfig dir must be exported by hand.
      - name: Install OpenCV 4
        run: |
          brew install opencv@4 pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix opencv@4)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Verify pkg-config sees opencv4
        run: pkg-config --modversion opencv4

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (offline/short)
        run: go test ./tests/... -short -v

  # Windows: verify the platform-specific syscall code compiles natively.
  # OpenCV/gocv setup on Windows CI is heavy, so we build only the non-cgo
  # packages here; the image package's cross-platform logic is already covered
  # by the macOS job.
  build-windows:
    name: Build (Windows, non-cgo pkgs)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build non-cgo packages
        run: >
          go build
          ./pkg/process/ ./pkg/capture/ ./pkg/mouse/ ./pkg/utils/
          ./pkg/platform/ ./pkg/keyboard/ ./pkg/safety/
